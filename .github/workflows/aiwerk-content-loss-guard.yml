name: AIWerk Content Loss Guard

# Trusted, standalone merge gate. The workflow and Python guard are loaded from
# the protected base branch by pull_request_target. Candidate Git objects are
# inspected but candidate code is never checked out, imported, or executed.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiwerk-content-loss-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  content-loss-guard:
    name: AIWerk content-loss guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base authority
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate event and fetch candidate Git objects
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 - "$BASE_SHA" "$HEAD_SHA" "$PR_NUMBER" <<'PY'
          import re
          import sys
          base, head, pr_number = sys.argv[1:]
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("invalid base SHA")
          if not re.fullmatch(r"[0-9a-f]{40}", head):
              raise SystemExit("invalid head SHA")
          if not re.fullmatch(r"[1-9][0-9]*", pr_number):
              raise SystemExit("invalid pull request number")
          PY
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git fetch --no-tags --force origin \
            "+refs/pull/${PR_NUMBER}/head:refs/aiwerk/candidate"
          RESOLVED_HEAD=$(git rev-parse refs/aiwerk/candidate)
          test "$RESOLVED_HEAD" = "$HEAD_SHA"
          git cat-file -e "${HEAD_SHA}^{commit}"

      - name: Evaluate effective PR tree
        id: evaluate-pr
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          python3 scripts/ci/content_loss_guard.py check-pr \
            --repo . \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --upstream cbd8de8ad64530be01efea23b7764d5c37c634ed \
            --pr-number "$PR_NUMBER" \
            --json-out content-loss-report.json \
            --markdown-out content-loss-report.md
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate current protected base
        id: evaluate-base
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set +e
          python3 scripts/ci/content_loss_guard.py check-range \
            --repo . \
            --active "$BASE_SHA" \
            --target "$BASE_SHA" \
            --upstream cbd8de8ad64530be01efea23b7764d5c37c634ed \
            --json-out content-loss-report.json \
            --markdown-out content-loss-report.md
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Replay exact 8bd56009 to 7b0cf741 incident
        id: historical
        run: |
          set +e
          python3 scripts/ci/content_loss_guard.py historical-self-test \
            --repo . \
            --json-out historical-content-loss-report.json \
            --markdown-out historical-content-loss-report.md
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish job summary
        if: always()
        run: |
          set -euo pipefail
          test -s content-loss-report.json
          test -s content-loss-report.md
          test -s historical-content-loss-report.json
          test -s historical-content-loss-report.md
          cat content-loss-report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat historical-content-loss-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload canonical reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: aiwerk-content-loss-reports
          path: |
            content-loss-report.json
            content-loss-report.md
            historical-content-loss-report.json
            historical-content-loss-report.md
          if-no-files-found: error
          retention-days: 30

      - name: Enforce guard verdict
        if: always()
        env:
          BASE_EXIT: ${{ steps.evaluate-base.outputs.exit_code }}
          HISTORICAL_EXIT: ${{ steps.historical.outputs.exit_code }}
          PR_EXIT: ${{ steps.evaluate-pr.outputs.exit_code }}
        run: |
          set -euo pipefail
          current="${PR_EXIT:-${BASE_EXIT:-3}}"
          test "$current" = "0"
          test "${HISTORICAL_EXIT:-3}" = "0"
